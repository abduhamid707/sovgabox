name: Frontend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop flows
        run: npx playwright test --workers=2
      - name: Upload mobile previews
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-preview
          path: test-results/**/*.jpg
          retention-days: 7
      - name: Save browser report on failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
